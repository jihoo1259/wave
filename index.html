<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>파동 시뮬레이터</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    color:white;
    font-family:sans-serif;
}

canvas{
    display:block;
}

#menu{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    background:#111;
    z-index:10;
    flex-wrap:wrap;
}

.menuBtn{
    width:260px;
    height:120px;
    border:none;
    border-radius:20px;
    font-size:28px;
    background:#222;
    color:white;
    cursor:pointer;
}

.menuBtn:hover{
    background:#333;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    z-index:5;
    display:none;
    line-height:2;
    font-size:17px;
    background:rgba(20,20,20,0.92);
    padding:18px;
    border-radius:18px;
}

#spacingUi{
    position:absolute;
    left:15px;
    bottom:15px;
    z-index:5;
    display:none;
    line-height:2;
    font-size:17px;
    background:rgba(20,20,20,0.92);
    padding:16px;
    border-radius:18px;
}

input[type="range"]{
    width:220px;
}

button{
    background:#222;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    margin-top:10px;
    margin-right:8px;
}

#hz{
    position:absolute;
    right:30px;
    top:20px;
    font-size:28px;
    z-index:5;
}
</style>
</head>

<body>

<div id="menu">

    <button class="menuBtn"
        onclick="start('transverse')">
        횡파
    </button>

    <button class="menuBtn"
        onclick="start('longitudinal')">
        종파
    </button>

    <button class="menuBtn"
        onclick="start('rotation')">
        파동의 성질
    </button>

    <button class="menuBtn"
        onclick="start('doppler')">
        도플러 효과
    </button>

</div>

<div id="ui">

    <div id="waveControls">

        진폭
        <input type="range"
            id="amp"
            min="10"
            max="180"
            value="80">

        <br>

        파장
        <input type="range"
            id="wave"
            min="1"
            max="40"
            value="15">

        <br>

        진동수
        <input type="range"
            id="speed"
            min="0.1"
            max="1.5"
            step="0.1"
            value="1">

    </div>

    <div id="rotationControls"
        style="display:none;">

        진동수
        <input type="range"
            id="rotationHz"
            min="0.1"
            max="1.5"
            step="0.1"
            value="1">

    </div>

    <div id="dopplerControls"
        style="display:none;">

        파면 간격
        <input type="range"
            id="dopplerSpacing"
            min="0.04"
            max="0.18"
            step="0.005"
            value="0.06">

        <br>

        파원 속도
        <input type="range"
            id="dopplerSourceSpeed"
            min="0.05"
            max="0.8"
            step="0.01"
            value="0.35">

    </div>

    <br>

    <button id="toggleBtn">
        Stop
    </button>

    <button id="homeBtn">
        Home
    </button>

</div>

<div id="spacingUi">

    입자 간격

    <input type="range"
        id="particleSpacing"
        min="10"
        max="140"
        value="20">

    <span id="spacingText">20</span>

</div>

<div id="hz">
    1.0 Hz
</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

function resize(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;
}

resize();

addEventListener("resize", resize);

let mode = null;

let t = 0;

let lastTime = performance.now();

let running = true;

let shift = false;
let ctrl = false;

let dopplerWaves = [];
let lastDopplerEmit = 0;

document.addEventListener("keydown", e=>{

    if(e.key === "Shift"){
        shift = true;
    }

    if(e.key === "Control"){
        ctrl = true;
    }
});

document.addEventListener("keyup", e=>{

    if(e.key === "Shift"){
        shift = false;
    }

    if(e.key === "Control"){
        ctrl = false;
    }
});

const ampSlider =
    document.getElementById("amp");

const waveSlider =
    document.getElementById("wave");

const speedSlider =
    document.getElementById("speed");

const rotationHzSlider =
    document.getElementById("rotationHz");

const dopplerSpacingSlider =
    document.getElementById("dopplerSpacing");

const dopplerSourceSpeedSlider =
    document.getElementById("dopplerSourceSpeed");

const particleSpacingSlider =
    document.getElementById("particleSpacing");

const spacingText =
    document.getElementById("spacingText");

const toggleBtn =
    document.getElementById("toggleBtn");

const homeBtn =
    document.getElementById("homeBtn");

const hzText =
    document.getElementById("hz");

particleSpacingSlider.oninput = ()=>{

    spacingText.innerText =
        particleSpacingSlider.value;
};

toggleBtn.onclick = ()=>{

    running = !running;

    toggleBtn.innerText =
        running ? "Stop" : "Start";
};

homeBtn.onclick = ()=>{

    mode = null;

    running = true;

    toggleBtn.innerText = "Stop";

    document.getElementById("menu")
        .style.display = "flex";

    document.getElementById("ui")
        .style.display = "none";

    document.getElementById("spacingUi")
        .style.display = "none";

    dopplerWaves = [];

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
};

function start(selected){

    mode = selected;

    lastTime = performance.now();

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("ui")
        .style.display = "block";

    document.getElementById("waveControls")
        .style.display = "none";

    document.getElementById("rotationControls")
        .style.display = "none";

    document.getElementById("dopplerControls")
        .style.display = "none";

    document.getElementById("spacingUi")
        .style.display = "none";

    if(mode === "rotation"){

        document.getElementById("rotationControls")
            .style.display = "block";
    }

    else if(mode === "doppler"){

        document.getElementById("dopplerControls")
            .style.display = "block";

        dopplerWaves = [];
        lastDopplerEmit = t;
    }

    else{

        document.getElementById("waveControls")
            .style.display = "block";

        document.getElementById("spacingUi")
            .style.display = "block";
    }

    animate(performance.now());
}

function drawGrid(){

    const gap = 48;

    ctx.strokeStyle = "#222";

    ctx.lineWidth = 1;

    for(let x=0;x<canvas.width;x+=gap){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,canvas.height);

        ctx.stroke();
    }

    for(let y=0;y<canvas.height;y+=gap){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(canvas.width,y);

        ctx.stroke();
    }
}

function drawWaveMode(){

    const amplitude =
        Number(ampSlider.value);

    const wavelength =
        Number(waveSlider.value) * 0.002;

    const hz =
        Number(speedSlider.value);

    hzText.innerText =
        hz.toFixed(1) + " Hz";

    const centerY =
        canvas.height / 2;

    const spacing =
        Number(particleSpacingSlider.value);

    if(mode === "longitudinal"){

        const grad =
            ctx.createLinearGradient(
                0,
                0,
                canvas.width,
                0
            );

        for(let i=0;i<=48;i++){

            const x =
                (i / 48) * canvas.width;

            const phase =
                (x * wavelength)
                - (Math.PI * 2 * hz * t);

            const density =
                (1 - Math.cos(phase)) / 2;

            const shade =
                Math.round(80 + density * 175);

            grad.addColorStop(
                i / 48,
                `rgba(${shade},${shade},${shade},0.28)`
            );
        }

        ctx.fillStyle = grad;

        ctx.fillRect(
            0,
            centerY - 8,
            canvas.width,
            16
        );
    }

    if(mode === "transverse"){

        ctx.beginPath();

        for(let x=0;x<canvas.width;x++){

            const phase =
                (x * wavelength)
                - (Math.PI * 2 * hz * t);

            const y =
                centerY +
                Math.sin(phase) * amplitude;

            if(x===0){
                ctx.moveTo(x,y);
            }

            else{
                ctx.lineTo(x,y);
            }
        }

        ctx.strokeStyle =
            "rgba(255,255,255,0.28)";

        ctx.lineWidth = 2;

        ctx.stroke();
    }

    for(let baseX=0;baseX<canvas.width;baseX+=spacing){

        const phase =
            (baseX * wavelength)
            - (Math.PI * 2 * hz * t);

        const value =
            Math.sin(phase);

        let px = baseX;
        let py = centerY;

        if(mode === "transverse"){

            py =
                centerY +
                value * amplitude;
        }

        else{

            px =
                baseX +
                value *
                (amplitude * 0.036);
        }

        if(!ctrl){

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                shift ? 14 : 7,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "white";

            ctx.fill();
        }
    }
}

function drawRotationMode(){

    const hz =
        Number(rotationHzSlider.value);

    hzText.innerText =
        hz.toFixed(1) + " Hz";

    const centerX = 280;
    const centerY = canvas.height/2;
    const radius = 120;

    const angle =
        Math.PI * 2 * hz * t;

    const dotX =
        centerX +
        Math.cos(angle) * radius;

    const dotY =
        centerY +
        Math.sin(angle) * radius;

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "#555";

    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(centerX, centerY);

    ctx.lineTo(dotX, dotY);

    ctx.strokeStyle = "white";

    ctx.lineWidth = 4;

    ctx.stroke();

    ctx.beginPath();

    ctx.arc(
        dotX,
        dotY,
        12,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "white";

    ctx.fill();

    ctx.beginPath();

    for(let x=0;x<700;x++){

        const waveY =
            centerY +
            Math.sin(
                angle - (x * 0.02)
            ) * radius;

        const px = 620 + x;

        if(x===0){
            ctx.moveTo(px, waveY);
        }

        else{
            ctx.lineTo(px, waveY);
        }
    }

    ctx.strokeStyle = "#4da6ff";

    ctx.lineWidth = 4;

    ctx.stroke();
}

function drawDopplerMode(){

    hzText.innerText = "";

    const centerY =
        canvas.height / 2;

    const waveSpeed = 360;

    const sourceSpeed =
        Number(
            dopplerSourceSpeedSlider.value
        );

    const moveRange =
        canvas.width * 0.22;

    const sourceX =
        canvas.width / 2 +
        Math.sin(
            t * sourceSpeed
        ) * moveRange;

    const sourceV =
        Math.cos(
            t * sourceSpeed
        ) * sourceSpeed * moveRange;

    const emitInterval =
        Number(
            dopplerSpacingSlider.value
        );

    if(
        running &&
        t - lastDopplerEmit >= emitInterval
    ){

        dopplerWaves.push({

            x: sourceX,
            y: centerY,
            time: t
        });

        lastDopplerEmit = t;
    }

    dopplerWaves =
        dopplerWaves.filter(
            w => t - w.time < 6
        );

    for(const wave of dopplerWaves){

        const age =
            t - wave.time;

        const radius =
            age * waveSpeed;

        const alpha =
            Math.max(
                0,
                1 - age / 6
            );

        ctx.beginPath();

        ctx.arc(
            wave.x,
            wave.y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            `rgba(90,180,255,${alpha})`;

        ctx.lineWidth = 2;

        ctx.stroke();
    }

    const leftObserverX = 100;

    const rightObserverX =
        canvas.width - 100;

    ctx.beginPath();

    ctx.arc(
        leftObserverX,
        centerY,
        8,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#ff6666";

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        rightObserverX,
        centerY,
        8,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#66ff99";

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        sourceX,
        centerY,
        11,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "white";

    ctx.fill();

    const dir =
        Math.sign(sourceV) || 1;

    ctx.beginPath();

    ctx.moveTo(
        sourceX,
        centerY
    );

    ctx.lineTo(
        sourceX + dir * 36,
        centerY
    );

    ctx.strokeStyle = "white";

    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        sourceX + dir * 36,
        centerY
    );

    ctx.lineTo(
        sourceX + dir * 26,
        centerY - 6
    );

    ctx.lineTo(
        sourceX + dir * 26,
        centerY + 6
    );

    ctx.closePath();

    ctx.fillStyle = "white";

    ctx.fill();
}

function animate(now){

    if(mode === null){
        return;
    }

    const dt =
        Math.min(
            0.05,
            (now - lastTime) / 1000
        );

    lastTime = now;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawGrid();

    if(mode === "rotation"){

        drawRotationMode();
    }

    else if(mode === "doppler"){

        drawDopplerMode();
    }

    else{

        drawWaveMode();
    }

    if(running){

        t += dt;
    }

    requestAnimationFrame(animate);
}

</script>

</body>
</html>
